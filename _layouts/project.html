---
layout: default
---

<article class="page project-page">

    <header class="page-header project-header">
        {% if page.category %}
        <p class="page-eyebrow">{{ page.category }}</p>
        {% endif %}

        <h1 class="page-title">{{ page.title }}</h1>

        {% if page.description %}
        <p class="page-description">{{ page.description }}</p>
        {% endif %}
    </header>

    {% if page.image %}
    <div class="project-image">
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <div class="page-content project-content">
        {{ content }}
    </div>

</article>
