<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AkaneDevLabs - Website Rewrite</title>
    <meta name="description" content="AkaneDevLabs is currently rebuilding its website. Please check back soon.">

    <style>
        @font-face {
            font-family: "Duplexide";
            src: url("/Old Site/fonts/Duplexide.ttf") format("truetype");
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #111318;
            background-image:
                    linear-gradient(#ffffff08 1px, transparent 1px),
                    linear-gradient(90deg, #ffffff08 1px, transparent 1px);
            background-size: 40px 40px;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 22px 40px;
            border-bottom: 1px solid #ffffff18;
            background: #111318dd;
        }

        header a {
            color: #eee;
            text-decoration: none;
            font-family: "Duplexide", sans-serif;
            font-size: 24px;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 150px 30px;
        }

        .accent {
            width: 45px;
            height: 3px;
            background: #a78bfa;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 42px);
            margin: 0 0 18px;
            letter-spacing: -1px;
        }

        p {
            max-width: 560px;
            color: #a5a5ad;
            font-size: 16px;
            line-height: 1.8;
        }

        .note {
            margin-top: 35px;
            color: #777985;
            font-size: 13px;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 20px 40px;
            border-top: 1px solid #ffffff18;
            background: #111318dd;
            color: #777985;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            main {
                padding: 110px 25px;
            }

            footer {
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>
<header>
    <a href="/">AkaneDevLabs</a>
</header>

<main>
    <div class="accent"></div>

    <h1>We're rebuilding our website.</h1>

    <p>
        AkaneDevLabs is currently undergoing a website rewrite.
        We're working on something new, so things might look a
        little quiet around here for a while.
    </p>

    <p>
        Please check back soon!
    </p>

    <div class="note">
        Website redevelopment in progress.
    </div>
</main>

<footer>
    &copy; <span id="year"></span> AkaneDevLabs
</footer>

<script>
    document.getElementById("year").textContent =
        new Date().getFullYear();
</script>
</body>
</html>
